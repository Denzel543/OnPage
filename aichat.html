<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #10a37f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #chatForm {
            width: 90%;
            max-width: 900px;
            height: 85vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 24px;
            text-align: center;
            background: linear-gradient(135deg, #10a37f 0%, #0d8e6f 100%);
            color: white;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .chat-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .chat-header p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        #answer {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f7f7f7;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #answer::-webkit-scrollbar {
            width: 8px;
        }

        #answer::-webkit-scrollbar-track {
            background: transparent;
        }

        #answer::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        #answer::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        p.user-msg {
            background: #10a37f;
            color: white;
            border-radius: 18px;
            padding: 12px 16px;
            margin-left: auto;
            max-width: 70%;
            word-wrap: break-word;
            text-align: left;
            font-size: 0.95rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            align-self: flex-end;
            line-height: 1.5;
        }

        .bot-response {
            background: white;
            border-radius: 18px;
            padding: 16px;
            margin-right: auto;
            max-width: 85%;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e0e0e0;
            align-self: flex-start;
        }

        .bot-response strong {
            color: #10a37f;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .bot-response h2 {
            font-size: 1.2rem;
            margin: 8px 0;
            color: #333;
        }

        .bot-response div {
            color: #555;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .bot-response div p {
            margin: 8px 0;
        }

        .loading {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #10a37f;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(1);
                opacity: 0.6;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        #inputSec {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #e5e5e5;
        }

        #inputSec h2 {
            display: none;
        }

        #inputSec form {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            background-color: #f0f0f0;
            padding: 12px 16px;
            color: #333;
            border-radius: 24px;
            border: 1px solid #d9d9e3;
            font-size: 0.95rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #10a37f;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.1);
        }

        input::placeholder {
            color: #999;
        }

        #send {
            background: #10a37f;
            padding: 12px 24px;
            color: white;
            border-radius: 24px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(16, 163, 127, 0.2);
        }

        #send:hover:not(:disabled) {
            background: #0d8e6f;
            box-shadow: 0 4px 12px rgba(16, 163, 127, 0.3);
        }

        #send:active:not(:disabled) {
            transform: scale(0.98);
        }

        #send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider {
            display: none;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div id="chatForm">
        <div class="chat-header">
            <h1>🔍 WikiAI</h1>
            <p>Wikipedia + AI</p>
        </div>

        <div id="answer"></div>

        <div class="divider" id="border"></div>

        <div id="inputSec">
            <h2>Chat:</h2>
            <form onsubmit="ans(event)">
                <input type="text" id="message" placeholder="Search Wikipedia... (e.g., Denzel Washington, Machine Learning, Paris)"/>
                <button id="send" type="submit">Send</button>
            </form>
        </div>
    </div>

    <script>
        const stopWords = new Set([
            'what', 'is', 'a', 'an', 'the', 'who', 'where', 'when', 'why', 'how',
            'does', 'do', 'can', 'could', 'would', 'should', 'are', 'am', 'be',
            'been', 'being', 'have', 'has', 'had', 'having', 'that', 'this', 'these',
            'those', 'in', 'on', 'at', 'to', 'for', 'of', 'with', 'by', 'from',
            'as', 'or', 'and', 'but', 'not', 'no', 'yes', 'please', 'tell', 'me',
            'us', 'my', 'your', 'our', 'their', 'i', 'you', 'he', 'she', 'it',
            'about', 'give', 'make', 'find', 'show', 'explain', 'describe', 'get'
        ]);

        function filterQueryWords(message) {
            const filtered = message
                .toLowerCase()
                .split(/\s+/)
                .filter(word => !stopWords.has(word) && word.length > 0)
                .join(' ')
                .trim();
            
            // If the filtered query is too short or empty, use original message
            return filtered.length >= 2 ? filtered : message.toLowerCase().trim();
        }

        function isGreeting(input) {
            const greetings = ['hello', 'hi', 'hey', 'greetings', 'good morning', 'good afternoon', 'good evening'];
            const lowerInput = input.toLowerCase().trim();
            // Match only if the entire input is just a greeting, not part of a larger query
            return greetings.some(greeting => lowerInput === greeting || lowerInput.match(new RegExp(`^${greeting}\\s*$`)));
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function isMathExpression(input) {
            return /^[0-9+\-*/().\s]+$/.test(input);
        }

        function showLoading() {
            const answer = document.getElementById('answer');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'bot-response loading';
            loadingDiv.innerHTML = '<span></span><span></span><span></span>';
            loadingDiv.id = 'loading-indicator';
            answer.appendChild(loadingDiv);
            answer.scrollTop = answer.scrollHeight;
            return loadingDiv;
        }

        function removeLoading() {
            const loading = document.getElementById('loading-indicator');
            if (loading) loading.remove();
        }

        function ans(event) {
            event.preventDefault();
            let message = document.getElementById('message').value.trim();
            
            if (!message) {
                console.warn('You need to have a message.');
                return;
            }

            const answer = document.getElementById('answer');
            const sendBtn = document.getElementById('send');

            // Display user message
            answer.innerHTML += `<p class="user-msg">${escapeHtml(message)}</p>`;
            document.getElementById('message').value = '';
            sendBtn.disabled = true;

            // Show loading indicator
            const loadingDiv = showLoading();

            if (isGreeting(message)) {
                removeLoading();
                answer.innerHTML += `<div class="bot-response"><strong>Hello!</strong> How can I help you? Try asking me about any topic, person, or concept and I'll search Wikipedia for you.</div>`;
            } 
            else if (isMathExpression(message)) {
                removeLoading();
                try {
                    let result = eval(message);
                    answer.innerHTML += `<div class="bot-response"><strong>Result:</strong> ${result}</div>`;
                } catch (error) {
                    answer.innerHTML += `<div class="bot-response error-msg"><strong>Error:</strong> I couldn't calculate that. Please check your math expression.</div>`;
                }
            } 
            else {
                const filteredQuery = filterQueryWords(message);
                const queryToUse = filteredQuery || message;

                fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(queryToUse)}`)
                    .then(response => response.json())
                    .then(data => {
                        removeLoading();
                        if (data.extract) {
                            answer.innerHTML += `<div class="bot-response">
                                <strong>${escapeHtml(data.title)}</strong>
                                <div>${escapeHtml(data.extract)}</div>
                            </div>`;
                        } else {
                            answer.innerHTML += `<div class="bot-response error-msg">
                                <strong>Not Found</strong>
                                <div>No Wikipedia article found for "${escapeHtml(queryToUse)}". Try a different search term.</div>
                            </div>`;
                        }
                        answer.scrollTop = answer.scrollHeight;
                        sendBtn.disabled = false;
                    })
                    .catch(error => {
                        console.error('Error fetching data:', error);
                        removeLoading();
                        answer.innerHTML += `<div class="bot-response error-msg">
                            <strong>Connection Error</strong>
                            <div>Couldn't reach Wikipedia. Please check your internet connection and try again.</div>
                        </div>`;
                        answer.scrollTop = answer.scrollHeight;
                        sendBtn.disabled = false;
                    });
            }

            setTimeout(() => {
                sendBtn.disabled = false;
                answer.scrollTop = answer.scrollHeight;
            }, 500);
        }

        document.getElementById('message').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                ans(new Event('submit'));
            }
        });
    </script>
</body>
</html>
