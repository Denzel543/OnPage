<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        body {
            background-color: rgb(247, 247, 247);
        }
        #passwordContainer {
            margin-left: 600px;
            margin-top: 255px;
            margin-right: 555px;
            border-radius: 8px;
            border: 1px solid black;
            padding: 5%;
            background-color: rgb(170, 241, 216);
            box-shadow: 0px 0px 5px 1px black;
        }
        #passwordBtn {
            background-color: green;
            color: white;
            border: 1px solid black;
            border-radius: 8px;
            padding: 12px;
            margin-left: 30px;
        }
        #passwordBtn:hover {
            cursor: pointer;
            background-color: white;
            color: green;
            padding: 16px;
        }
        #password {
            font-weight: 900;
            color: darkblue;
        }
    </style>
</head>
<body>
    <div id="passwordContainer">
        <div id="passwordForm">
            <button id="passwordBtn" onclick="newPassword()">Get Password</button>
            <br>
            <br>
            <br>
            <div><span>Your Password is: </span><code><span id="password"></span></code></div>
        </div>
    </div>
    <script>
        let password = document.getElementById('password');
        function newPassword() {
            let letters = ['a', 'A', 'b', 'B', 'c', 'C', 'd', 'D', 'e', 'E', 'f', '-', 'F', 'g', 'G', '-', 'h', 'H', 'i', 'I', 'j', 'J', 'k', 'K', 'l', 'L', 'm', 'M', 'n', 'N', 'o', 'O', 'p', 'P', 'q', 'Q', 'r', 'R', 's', 'S', 't', 'T', 'u', 'U', 'v', 'V', 'w', 'W', 'x', 'X', 'y', 'Y', 'z', 'Z'];
            let keyNum = Math.round([Math.random() * 52])
            let keyLetters = letters[Math.round([Math.random() * 52])]
            let key = `${letters[Math.round([Math.random() * 52])]}${Math.round([Math.random() * 52])}${Math.round([Math.random() * 52])}${Math.round([Math.random() * 52])}${letters[Math.round([Math.random() * 52])]}`
            console.log(key)
            password.textContent=key
        }
    </script>
</body>
</html>
